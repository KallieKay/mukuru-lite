<!doctype html>
<html lang="sn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mama's Phone</title>
  <!-- Receiver view: a basic feature phone in Harare. No CDN scripts. -->
  <link rel="stylesheet" href="css/mama.css">
</head>
<body>

<div class="phone" id="phone" aria-label="Mama's phone in Harare">
  <div class="brand">HARARE &middot; +263 77 000 0001</div>

  <div class="screen" id="screen">
    <div class="lcd-bar"><span>&#9602;&#9603;</span><span id="clock"></span></div>
    <div class="lcd-title" id="title"></div>
    <div class="lcd-body" id="body" role="log" aria-live="assertive"></div>
    <div class="lcd-soft"><span id="soft-left"></span><span id="soft-right"></span></div>
  </div>

  <div class="softkeys">
    <button id="left"></button>
    <button class="nav" id="next" aria-label="Next message">&#9660;</button>
    <button id="right"></button>
  </div>

  <div class="keys" aria-hidden="true">
    <button>1</button><button>2</button><button>3</button>
    <button>4</button><button>5</button><button>6</button>
    <button>7</button><button>8</button><button>9</button>
  </div>

  <div class="lang" role="group" aria-label="Phone language">
    <button data-lang="sn">ChiShona</button>
    <button data-lang="en">English</button>
  </div>
</div>

<script src="js/mama.js"></script>
</body>
</html>
